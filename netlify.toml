# Configurações de Redirecionamento e URLs Limpas para o Netlify

# 0. SEGURANÇA: nunca servir arquivos internos (planilhas de clientes, SQL,
#    documentação, scripts, mock de leads). force = true faz a regra valer
#    mesmo que o arquivo exista no deploy. Precisa ficar ANTES das demais.
[[redirects]]
  from = "/dados-planilhas/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/sql/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/leads_mock.js"
  to = "/404"
  status = 404
  force = true

# Cabeçalhos de segurança em todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Painel e login não devem ficar em cache compartilhado
[[headers]]
  for = "/dashboard"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# 1. Redirecionar proposta.html para /proposta (URL Limpa)
[[redirects]]
  from = "/proposta.html"
  to = "/proposta"
  status = 301
  force = true

# Servir proposta.html internamente ao acessar /proposta
[[redirects]]
  from = "/proposta"
  to = "/proposta.html"
  status = 200

# 2. Redirecionar login.html para /login (URL Limpa)
[[redirects]]
  from = "/login.html"
  to = "/login"
  status = 301
  force = true

# Servir login.html internamente ao acessar /login
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# 3. Redirecionar dashboard.html para /dashboard (URL Limpa)
[[redirects]]
  from = "/dashboard.html"
  to = "/dashboard"
  status = 301
  force = true

# Servir dashboard.html internamente ao acessar /dashboard
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# Servir dashboard.html internamente ao acessar qualquer subdiretório de /dashboard/ (ex: /dashboard/prospeccao)
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard.html"
  status = 200

